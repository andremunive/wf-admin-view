<div class="close-modal">
  <button mat-icon-button class="close-btn" (click)="close()">
    <mat-icon>close</mat-icon>
  </button>
</div>
<h2 mat-dialog-title class="modal-header">Registrar Tercero</h2>

<mat-dialog-content class="modal-body">
  <mat-stepper linear #stepper>
    <!-- Paso 1 -->
    <mat-step [stepControl]="step1">
      <form [formGroup]="step1">
        <ng-template matStepLabel>Información general</ng-template>
        <div class="form-grid">
          <mat-form-field appearance="outline">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="name" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Género</mat-label>
            <mat-select formControlName="gender">
              <mat-option value="Masculino">Masculino</mat-option>
              <mat-option value="Femenino">Femenino</mat-option>
              <mat-option value="No aplica">No aplica</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Fecha de nacimiento</mat-label>
            <input matInput type="date" formControlName="birth_date" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Tipo de documento</mat-label>
            <mat-select formControlName="document_type_id">
              <mat-option value="1">Cédula</mat-option>
              <mat-option value="2">NIT</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Número de documento</mat-label>
            <input matInput formControlName="document_number" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" />
          </mat-form-field>
        </div>

        <div class="step-actions">
          <button
            mat-flat-button
            color="primary"
            (click)="stepper.next()"
            [disabled]="step1.invalid"
          >
            Siguiente
          </button>
        </div>
      </form>
    </mat-step>

    <!-- Paso 2 -->
    <mat-step [stepControl]="step2">
      <form [formGroup]="step2">
        <ng-template matStepLabel>Información específica</ng-template>
        <div class="form-grid">
          <mat-form-field appearance="outline">
            <mat-label>Dirección</mat-label>
            <input matInput formControlName="address" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Teléfono</mat-label>
            <input matInput formControlName="phone" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Rol</mat-label>
            <mat-select formControlName="user_role_id">
              <mat-option value="1">Cliente</mat-option>
              <mat-option value="2">Entrenador</mat-option>
              <mat-option value="3">Administrador</mat-option>
              <mat-option value="4">Proveedor</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field
            appearance="outline"
            *ngIf="step2.get('user_role_id')?.value === '1'"
          >
            <mat-label>Entrenador</mat-label>
            <mat-select formControlName="trainer_id">
              <mat-option *ngFor="let t of trainers" [value]="t.id">
                {{ t.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="step-actions">
          <button mat-button (click)="stepper.previous()">Atrás</button>
          <button
            mat-flat-button
            color="primary"
            (click)="save()"
            [disabled]="step2.invalid"
          >
            Guardar
          </button>
        </div>
      </form>
    </mat-step>
  </mat-stepper>
</mat-dialog-content>
